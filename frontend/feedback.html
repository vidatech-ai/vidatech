<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidatech WiFi — Report an Issue</title>
<link rel="icon" type="image/svg+xml" href="https://vidatech-wifi.pages.dev/src/assets/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://vidatech-wifi.pages.dev/src/css/main.css" />
<style>
body { min-height: 100vh; background: #0a0a0f; color: #fff; font-family: 'Inter', sans-serif; }
.fb-wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 60px; }
.fb-back { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 10px 18px; color: #fff; font-size: 14px; font-weight: 600; text-decoration: none; margin-bottom: 28px; transition: background .2s; }
.fb-back:hover { background: rgba(255,255,255,0.14); }
.fb-logo { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 6px; }
.fb-logo span { color: #10b981; }
.fb-headline { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 800; margin: 0 0 8px; }
.fb-sub { color: rgba(255,255,255,0.55); font-size: 14px; line-height: 1.6; margin: 0 0 32px; }
.fb-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 28px 24px; margin-bottom: 16px; }
.fb-field { margin-bottom: 18px; }
.fb-field label { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 8px; }
.fb-field input, .fb-field textarea { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 12px 14px; color: #fff; font-size: 14px; font-family: inherit; outline: none; box-sizing: border-box; transition: border-color .2s; resize: vertical; }
.fb-field input:focus, .fb-field textarea:focus { border-color: #10b981; }
.fb-field input::placeholder, .fb-field textarea::placeholder { color: rgba(255,255,255,0.3); }
.fb-field textarea { min-height: 120px; }
.fb-btn { width: 100%; padding: 14px; background: #10b981; border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: background .2s; margin-top: 4px; }
.fb-btn:hover { background: #059669; }
.fb-btn:disabled { background: rgba(16,185,129,0.4); cursor: not-allowed; }
.fb-status { text-align: center; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; margin-top: 14px; }
.fb-status.success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #10b981; }
.fb-status.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ef4444; }
.fb-divider { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 32px 0 24px; }
.fb-thread-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 16px; }
.fb-entry { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.fb-entry-meta { font-size: 11.5px; color: rgba(255,255,255,0.4); margin-bottom: 8px; }
.fb-entry-msg { font-size: 14px; color: #fff; line-height: 1.6; margin-bottom: 10px; }
.fb-entry-reply { background: rgba(16,185,129,0.08); border-left: 3px solid #10b981; border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.6; }
.fb-entry-reply-label { font-size: 11px; font-weight: 700; color: #10b981; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.fb-empty { text-align: center; color: rgba(255,255,255,0.3); font-size: 14px; padding: 24px 0; }
</style>
</head>
<body>
<div class="fb-wrap">
  <a class="fb-back" href="/">← Back to Portal</a>
  <div class="fb-logo">Vidatech<span>WiFi</span></div>
  <h1 class="fb-headline">Report an Issue</h1>
  <p class="fb-sub">Having trouble with the WiFi? Want to suggest something? Let us know — we read every message and reply as soon as possible.</p>

  <div class="fb-card">
    <div class="fb-field">
      <label>Your M-Pesa Number <span style="color:rgba(255,255,255,0.3);font-weight:400">(optional)</span></label>
      <input type="tel" id="fbPhone" placeholder="07XX XXX XXX" maxlength="13" />
    </div>
    <div class="fb-field">
      <label>Time you connected <span style="color:rgba(255,255,255,0.3);font-weight:400">(optional)</span></label>
      <input type="text" id="fbTime" placeholder="e.g. Around 3pm, or Tuesday morning" />
    </div>
    <div class="fb-field">
      <label>Your message <span style="color:#ef4444">*</span></label>
      <textarea id="fbMessage" placeholder="Describe your issue or suggestion…"></textarea>
    </div>
    <button class="fb-btn" id="fbBtn" onclick="submitFeedback()">Send Message</button>
    <div class="fb-status" id="fbStatus"></div>
  </div>

  <hr class="fb-divider" />
  <div class="fb-thread-title">💬 Community Board</div>
  <div id="fbThread"><div class="fb-empty">Loading…</div></div>
</div>

<script>
var API = window.location.hostname === "192.168.2.1"
  ? "http://192.168.2.1/cgi-bin/proxy"
  : "https://vidatech-wifi-z55g.onrender.com";

function submitFeedback() {
  var phone = document.getElementById("fbPhone").value.trim();
  var time = document.getElementById("fbTime").value.trim();
  var msg = document.getElementById("fbMessage").value.trim();
  var btn = document.getElementById("fbBtn");
  var status = document.getElementById("fbStatus");

  if (!msg) {
    status.textContent = "Please enter your message.";
    status.className = "fb-status error";
    status.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending…";
  status.style.display = "none";

  fetch(API + "/api/feedback/", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phone: phone || null, connected_at: time || null, message: msg })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.ok) {
      status.textContent = "✅ Message sent! We\'ll get back to you soon.";
      status.className = "fb-status success";
      document.getElementById("fbPhone").value = "";
      document.getElementById("fbTime").value = "";
      document.getElementById("fbMessage").value = "";
      setTimeout(loadThread, 300);
    } else {
      status.textContent = d.error || "Something went wrong. Please try again.";
      status.className = "fb-status error";
    }
    status.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Send Message";
  })
  .catch(function() {
    status.textContent = "Network error. Please try again.";
    status.className = "fb-status error";
    status.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Send Message";
  });
}

function loadThread() {
  fetch(API + "/api/feedback/public")
  .then(function(r) { return r.json(); })
  .then(function(data) {
    var el = document.getElementById("fbThread");
    if (!data.length) {
      el.innerHTML = '<div class="fb-empty">No messages yet — be the first to share your experience!</div>';
      return;
    }
    el.innerHTML = data.map(function(f) {
      var date = new Date(f.created_at).toLocaleString();
      var phone = f.phone ? f.phone.slice(0,5) + "****" + f.phone.slice(-2) : "Anonymous";
      var reply = f.admin_reply
        ? '<div class="fb-entry-reply"><div class="fb-entry-reply-label">Vidatech Response</div>' + f.admin_reply + '</div>'
        : '';
      return '<div class="fb-entry">' +
        '<div class="fb-entry-meta">' + phone + ' · ' + date + (f.connected_at ? ' · Connected: ' + f.connected_at : '') + '</div>' +
        '<div class="fb-entry-msg">' + f.message + '</div>' +
        reply +
      '</div>';
    }).join('');
  })
  .catch(function() {
    document.getElementById("fbThread").innerHTML = '<div class="fb-empty">Could not load messages.</div>';
  });
}

loadThread();
</script>
</body>
</html>
