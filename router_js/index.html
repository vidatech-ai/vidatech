<script>
const ua = window.navigator.userAgent;
if (ua.indexOf("MSIE ") > 0 || !!ua.match(/Trident.*rv:11\./)) {
window.alert("系统暂不支持 IE 浏览器和 360 浏览器的兼容模式，建议您更换浏览器或使用 360 浏览器的极速模式")
}
let showErrorAlert = true;
const checkFileExtsion = (src) => {
return src.indexOf('.css') != -1 || src.indexOf('.js') != -1 || src.indexOf('.ttf') != -1 || src.indexOf('.woff') != -1 || src.indexOf('.woff2') != -1;
}
// 添加全局错误监听器
window.addEventListener('error', (event) => {
if(!showErrorAlert) return;
const target = event.target || event.srcElement;
const isResourceError = target instanceof HTMLScriptElement || target instanceof HTMLLinkElement || target instanceof HTMLImageElement;
if (isResourceError) {
const src = target.src || target.href;
if (src && src.indexOf('/assets/') != -1 && checkFileExtsion(src)) {
alert("WebUI resource loading failed. Please check your network connection and refresh the page to try again.");
showErrorAlert = false;
// 刷新的时候在url添加随机数
history.replaceState(null, '', window.location.pathname + '?nocache=' + new Date().getTime());
location.reload()
}
}
}, true);
</script>
